<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Request Outing</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- =========================
       TOP BAR
  ========================== -->

  <header class="topbar">

    <div class="brand">

      <div class="logo-circle">
  <img
    src="assets/logo.png"
    alt="SRM logo"
    class="logo"
    onerror="this.style.display='none'"
  />
</div>

      <span>REQUEST OUTING</span>

    </div>


    <div class="page-title">
      Request Outing
    </div>


    <div class="account">

      <span>
        pc0369@srmist.edu.in
      </span>

      <button
        class="logout"
        type="button"
        onclick="fakeLogout()"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- =========================
       MAIN PAGE
  ========================== -->

  <main class="page">


    <!-- PAGE HEADING -->

    <section class="heading">

      <h1>
        Request Outing
      </h1>

      <div class="rule"></div>

    </section>



    <!-- =========================
         REQUEST FORM
    ========================== -->

    <section class="card form-card">

      <form id="outingForm">

        <label for="fullName">
          Full Name:
        </label>

        <input
          id="fullName"
          class="readonly"
          value="PRAGYA CHAUDHARY (RA2311003010366)"
          readonly
        />


        <label for="email">
          Email (SRM):
        </label>

        <input
          id="email"
          class="readonly"
          value="pc0369@srmist.edu.in"
          readonly
        />


        <label for="roomNumber">
          Room Number:
        </label>

        <input
          id="roomNumber"
          type="text"
          required
          placeholder="Enter your room number"
        />


        <label for="hostel">
          Hostel Name:
        </label>

        <input
          id="hostel"
          class="readonly"
          value="Sannasi C"
          readonly
        />


        <label for="outDate">
          Out Date:
        </label>

        <input
          id="outDate"
          type="date"
          required
        />


        <label for="outTime">
          Out Time:
        </label>

        <input
          id="outTime"
          type="time"
          required
        />


        <label for="inDate">
          In Date:
        </label>

        <input
          id="inDate"
          type="date"
          required
        />


        <label for="inTime">
          In Time:
        </label>

        <input
          id="inTime"
          type="time"
          required
        />


        <label for="reason">
          Reason for Outing:
        </label>

        <input
          id="reason"
          type="text"
          required
          placeholder="Enter reason for outing"
        />


        <label for="parentEmail">
          Parent Email:
        </label>

        <input
          id="parentEmail"
          type="email"
          placeholder="Enter parent email"
        />


        <label for="parentPhone">
          Parent Phone:
        </label>

        <input
          id="parentPhone"
          type="tel"
          placeholder="Enter parent phone"
        />


        <button
          class="send"
          type="submit"
        >
          Send Request
        </button>

      </form>

    </section>



    <!-- =========================
         OTP SECTION
    ========================== -->

    <div
      class="otp-wrap"
      id="otpSection"
    >

      <!-- Generated by JavaScript -->

    </div>



    <!-- =========================
         PAST OUTINGS
    ========================== -->

    <section class="history">

      <h2>
        Past Outings
      </h2>

      <div class="rule"></div>


      <div
        class="history-grid"
        id="historyGrid"
      >

        <!-- Generated by JavaScript -->

      </div>

    </section>

  </main>



  <!-- DARK MODE -->

  <button
    class="theme"
    onclick="toggleDarkMode()"
    aria-label="Toggle dark mode"
  >
    ◐
  </button>


  <script src="script.js"></script>

</body>
</html>
